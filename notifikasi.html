<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi & Promo - Tumbasakun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0f172a; color: white; margin: 0; font-family: sans-serif; min-height: 100vh;">

    <!-- HEADER UTAMA -->
    <header class="navbar" id="navbar">
        <button class="menu-btn" aria-label="Menu" onclick="openSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div style="display: flex; align-items: center; gap: 7px;">
            <button style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
            </button>
            <div class="flag-icon">
                <img src="https://flagcdn.com/w40/id.png" alt="Indonesia Flag">
            </div>
        </div>
    </header>

    <!-- KONTEN HALAMAN -->
    <main style="padding: 16px; max-width: 500px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h1 style="font-size: 18px; font-weight: bold; margin: 0;">Notifikasi & Promo</h1>
            <a href="index.html" style="font-size: 12px; color: #fbbf24; text-decoration: none; border: 1px solid #fbbf24; padding: 6px 12px; border-radius: 8px;">← Kembali</a>
        </div>
        
        <!-- Baris Info Promo -->
        <div style="background-color: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="font-size: 11px; color: #fbbf24; font-weight: bold;">INFO PROMO</span>
                <span style="font-size: 11px; color: #94a3b8;">Baru saja</span>
            </div>
            <p style="font-size: 13px; color: #e2e8f0; margin: 0;">Advance Server Mobile Legends sudah restock! Silakan cek beranda untuk order.</p>
        </div>

        <!-- Baris Status Transaksi -->
        <div style="background-color: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="font-size: 11px; color: #60a5fa; font-weight: bold;">STATUS TRANSAKSI</span>
                <span style="font-size: 11px; color: #94a3b8;">Hari ini</span>
            </div>
            <p style="font-size: 13px; color: #e2e8f0; margin: 0;">Belum ada riwayat transaksi aktif saat ini.</p>
        </div>
    </main>
    
</body>
</html>
